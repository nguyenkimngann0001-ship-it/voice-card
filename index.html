<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VoiceCard — Tạo Thiệp & Mã QR Bảo Mật</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #FAF7F2; --card: #FFFFFF; --ink: #172A27; --muted: #5E6D69;
      --accent: #B8860B; --accent-soft: #F5EEDB; --forest: #1B3632;
      --border: #E6DFD3; --danger: #B91C1C;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 20px; }
    .container { max-width: 1040px; margin: 0 auto; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .brand { font-size: 24px; font-weight: 800; color: var(--forest); }
    .brand span { color: var(--accent); }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; }
    .tab-btn { padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--ink); font-weight: 600; cursor: pointer; font-size: 14px; }
    .tab-btn.active { background: var(--forest); color: #fff; border-color: var(--forest); }
    .grid { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 24px; align-items: start; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 22px; box-shadow: 0 6px 24px rgba(27,54,50,0.04); }
    h2 { font-size: 18px; margin-bottom: 14px; color: var(--forest); }
    .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .chip { padding: 6px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--accent-soft); color: var(--forest); border: 1px solid #E6D5A8; cursor: pointer; }
    .field { margin-bottom: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--forest); }
    input, select, textarea { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); font-size: 14px; font-family: inherit; background: #FFFDF9; }
    textarea { min-height: 76px; resize: vertical; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 520px) { .row-2 { grid-template-columns: 1fr; } }
    .audio-box { background: #FAF7F2; border: 1px dashed #C8B99B; border-radius: 12px; padding: 12px; }
    .audio-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
    .btn { padding: 10px 16px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #fff; width: 100%; justify-content: center; padding: 13px; font-size: 15px; }
    .btn-forest { background: var(--forest); color: #fff; }
    .btn-outline { background: #fff; color: var(--ink); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    audio, video { width: 100%; margin-top: 8px; border-radius: 10px; max-height: 200px; }
    .qr-card { text-align: center; }
    .qr-box { display: inline-flex; justify-content: center; align-items: center; padding: 16px; background: #fff; border: 2px solid var(--accent-soft); border-radius: 16px; margin: 12px auto; min-height: 216px; min-width: 216px; }
    .pin-badge { display: inline-block; background: var(--accent-soft); color: var(--forest); padding: 4px 12px; border-radius: 999px; font-size: 13px; font-weight: 700; margin-bottom: 12px; }
    .qr-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
    .hint { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
    .status-msg { font-size: 13px; color: var(--forest); font-weight: 600; margin-top: 6px; }
    .vault-wrap { max-width: 520px; margin: 0 auto; text-align: center; }
    .pin-inputs { display: flex; justify-content: center; gap: 10px; margin: 18px 0; }
    .pin-inputs input { width: 52px; height: 58px; text-align: center; font-size: 24px; font-weight: 800; border-radius: 12px; border: 2px solid var(--border); }
    .pin-inputs input:focus { outline: none; border-color: var(--accent); }
    .error-text { color: var(--danger); font-size: 13.5px; font-weight: 600; min-height: 20px; margin-bottom: 8px; }
    .unlocked-card { text-align: left; background: linear-gradient(160deg, #FFFDF9 0%, #F7EFE0 100%); border: 1px solid #DEC996; border-radius: 18px; padding: 22px; margin-top: 16px; }
    .tag { display: inline-block; background: var(--forest); color: #fff; font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; margin-bottom: 10px; }
    .hidden { display: none !important; }
    @media print { header, .panel:first-child, .qr-actions, .hint, .tabs { display: none !important; } body { background: #fff; } .panel { box-shadow: none; border: 1px solid #ccc; } }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">Voice<span>Card</span></div>
      <div class="tabs">
        <button class="tab-btn active" id="tabSender" onclick="switchTab('sender')">1. Tạo Thiệp & Lấy QR</button>
        <button class="tab-btn" id="tabRecipient" onclick="switchTab('recipient')">2. Mở Thiệp (Quét QR / PIN)</button>
      </div>
    </header>

    <section id="senderView" class="grid">
      <div class="panel">
        <h2>Thiết kế lời nhắn cho thiệp</h2>
        <div class="presets">
          <button type="button" class="chip" onclick="applyPreset('grad')">Mẫu Tốt nghiệp</button>
          <button type="button" class="chip" onclick="applyPreset('bday')">Mẫu Sinh nhật</button>
          <button type="button" class="chip" onclick="applyPreset('b2b')">Mẫu Tri ân khách hàng</button>
        </div>

        <div class="row-2">
          <div class="field">
            <label>Chủ đề thiệp</label>
            <select id="themeSelect">
              <option value="Tốt nghiệp">Tốt nghiệp</option>
              <option value="Sinh nhật">Sinh nhật</option>
              <option value="Kỷ niệm & Yêu thương">Kỷ niệm & Yêu thương</option>
              <option value="Tri ân đối tác / Khách hàng">Tri ân đối tác / Khách hàng</option>
            </select>
          </div>
          <div class="field">
            <label>Mã PIN bảo mật (4 chữ số)</label>
            <input id="pinInput" type="text" maxlength="4" value="1234" oninput="this.value=this.value.replace(/\D/g,'')" />
          </div>
        </div>

        <div class="row-2">
          <div class="field">
            <label>Người gửi</label>
            <input id="senderInput" type="text" value="Minh Anh" />
          </div>
          <div class="field">
            <label>Người nhận</label>
            <input id="recipientInput" type="text" value="Lan Phương" />
          </div>
        </div>

        <div class="field">
          <label>Lời nhắn văn bản</label>
          <textarea id="messageInput">Chúc mừng cậu đã hoàn thành chặng đường đại học thật rực rỡ! Nghe lời nhắn thoại mình thu riêng cho cậu nhé.</textarea>
        </div>

        <div class="field">
          <label>Lời nhắn giọng nói / Video</label>
          <div class="audio-box">
            <div class="audio-actions">
              <button type="button" class="btn btn-forest" id="recBtn"
